name: Generate optimized WebP assets

on:
  push:
    branches:
      - perf/nexus-webp-20261013
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-webp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    if: github.ref == 'refs/heads/perf/nexus-webp-20261013'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Generate and verify WebP assets
        run: python scripts/optimize_images.py
      - name: Validate generated JavaScript and diff
        run: |
          python -m compileall -q scripts/optimize_images.py
          node --check script.js
          node --check js/projects-data.js
          node --check js/certifications-data.js
          git diff --check
      - name: Commit generated files to this branch
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- assets/branding assets/projects assets/certifications js script.js ./*.html
            git commit -m "perf: publish lighter WebP cards and certificate previews"
            git push
          fi
